name: Update profile stats

on:
  schedule:
    - cron: "0 0 * * *"      # every day, 00:00 UTC
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/workflows/stats.yml"
      - ".github/scripts/generate_stats.py"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          DISPLAY_NAME: Vampire
          OUT_DIR: assets
        run: python .github/scripts/generate_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git diff --cached --quiet || git commit -m "chore: update profile stats [skip ci]"
          git push
