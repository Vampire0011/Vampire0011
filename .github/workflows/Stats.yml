name: Update profile stats

on:
  schedule:
    - cron: "0 0 * * *"      # every day, 00:00 UTC
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/stats.yml"]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make assets folder
        run: mkdir -p assets

      # Contribution graph as a snake animation (light + dark)
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg
            assets/snake-dark.svg?palette=github-dark

      # Stats card (commits, PRs, issues, stars, languages)
      - name: Generate stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          filename: stats.svg
          output_action: none

      # metrics writes its render to /metrics_renders, so copy it into the repo
      - name: Copy stats card into assets
        run: |
          ls -la /metrics_renders
          sudo cp /metrics_renders/stats.svg assets/stats.svg
          sudo chown "$USER":"$USER" assets/stats.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-light.svg assets/snake-dark.svg assets/stats.svg
          git diff --cached --quiet || git commit -m "chore: update profile stats [skip ci]"
          git push
